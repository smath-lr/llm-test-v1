[pytest]
# 搜索用例的目录
testpaths = tests
# 默认执行参数，每次pytest自动带上
# `-v` = verbose，详细输出（看到每个用例名字、成功失败）
addopts = -v
# 注册自定义标记，避免执行报警告
markers =
    mock: 使用mocker模拟API调用，无真实网络请求，不消耗token
    real_api: 调用真实LLM接口，会消耗token
    slow: LLM长推理用例，执行耗时较高
    llm_stream: LLM流式返回chunk相关测试
    need_retry: 依赖重试逻辑的接口用例
# 测试文件匹配规则
python_files = test_*.py
python_classes = Test*
python_functions = test_*
