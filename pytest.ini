[pytest]
# 搜索用例的目录
testpaths = tests
# 默认执行参数，每次pytest自动带上
# `-v` = verbose，详细输出（看到每个用例名字、成功失败）
addopts = -v
# 注册自定义标记，避免执行报警告
markers =
    mock: 使用mocker补丁模拟调用api接口，非真实网络请求
    real_api: 真实调用api接口，会产生token消耗的用例
    slow: LLM长推理，耗时高的用例
    llm_stream: 流式返回chunk测试
    need_retry: 容易报429/504、需要重试的接口用例
# 测试文件匹配规则
python_files = test_*.py
python_classes = Test*
python_functions = test_*
