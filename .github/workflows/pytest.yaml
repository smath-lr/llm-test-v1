# 触发条件
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# 任务
jobs:
  test:
    # 运行环境 ubuntu-latest 最新版
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write

    steps:
      # 检出代码
      - name: Checkout
        uses: actions/checkout@v4

      # 设置 Python 版本
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # 安装依赖
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # 运行测试，只跑mock用例,并生成 html report + allure results
      - name: Run mock tests and generate html report + allure results
        run: |
          mkdir -p reports
          python -m pytest -v -m mock \
            --html=reports/pytest_report.html \
            --self-contained-html \
            --alluredir=reports/allure-results

      # 生成 allure report
      - name: Generate allure report
        uses: afiore/action-allure-report@v0.1.0
        with:
          results-dir: reports/allure-results
          report-dir: reports/allure-report

      # 部署 allure report 到 GitHub Pages
      - name: Deploy Allure report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./reports/allure-report
          publish_branch: gh-pages

      # 上传报告
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: reports/
          retention-days: 7
          if-no-files-found: warn